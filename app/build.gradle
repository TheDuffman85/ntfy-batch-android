apply plugin: 'com.android.application'

android {
    namespace 'de.theduffman85.ntfyrelay'
    compileSdk 35

    defaultConfig {
        applicationId 'de.theduffman85.ntfyrelay'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = 'ntfy-batch-share.apk'
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
